name: Quality gate

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

# Runs the contract of `pnpm run ci` (lint, typecheck, typecheck:tests, test,
# build) split across jobs; keep both in sync. The Vitest suite is most of the
# run time, so it is sharded across runners while the static checks and the
# build run on another one. The final `Quality gate` job is the single check to
# require in branch protection.
jobs:
  static-checks-and-build:
    name: Static checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up quality gate
        uses: ./.github/actions/setup-quality-gate

      - parallel:
          - name: Lint
            run: pnpm run lint

          - name: Type-check product code
            run: pnpm run typecheck

          - name: Type-check tests
            run: pnpm run typecheck:tests

      - name: Build
        run: pnpm run build

  tests:
    name: Tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up quality gate
        uses: ./.github/actions/setup-quality-gate

      - name: Install browser required by native transport tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Run test shard
        run: pnpm run test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  quality-gate:
    name: Quality gate
    needs: [static-checks-and-build, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality gate job to succeed
        env:
          STATIC_CHECKS_RESULT: ${{ needs.static-checks-and-build.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          set -euo pipefail
          echo "Static checks and build: ${STATIC_CHECKS_RESULT}; tests: ${TESTS_RESULT}"
          if [ "${STATIC_CHECKS_RESULT}" != "success" ] || [ "${TESTS_RESULT}" != "success" ]; then
            echo "::error title=Quality gate failed::Static checks and build ended as ${STATIC_CHECKS_RESULT} and the test shards as ${TESTS_RESULT}."
            exit 1
          fi
