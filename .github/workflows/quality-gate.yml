name: Quality gate

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSKY: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure isolated build environment
        shell: bash
        run: |
          set -euo pipefail
          for variable in BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$variable" "$value" >> "$GITHUB_ENV"
          done
          printf '%s\n' \
            'BETTER_AUTH_URL=http://127.0.0.1:3000' \
            'DATABASE_URL=postgresql://127.0.0.1:5432/quality_gate' \
            >> "$GITHUB_ENV"

      - name: Run quality gate
        run: pnpm run ci
