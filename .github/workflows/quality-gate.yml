name: Quality Gate

on:
  push:
  pull_request:

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@siteping"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Verify toolchain
        run: |
          node --version
          pnpm --version
          pnpm exec tsc --version

      - name: Run quality gate
        env:
          BETTER_AUTH_SECRET: github-actions-build-secret-with-32-characters
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://ci:ci@localhost:5432/tutribu
          GOOGLE_CLIENT_ID: github-actions-google-client-id
          GOOGLE_CLIENT_SECRET: github-actions-google-client-secret
        run: pnpm run ci
