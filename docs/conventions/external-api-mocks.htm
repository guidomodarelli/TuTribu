<div class="doc-header">
  <div class="doc-label">CONVENTION</div>
  <div class="doc-title">External API Mocks</div>
  <div class="doc-sub">Cómo correr el servidor local con proveedores externos simulados en memoria mediante MSW, sin credenciales reales y sin tocar producción.</div>
  <div class="doc-meta"><span>Scope: Local development</span><span>Status: Active</span></div>
</div>

<div class="section">
  <div class="section-num">01</div>
  <div class="section-title">Overview</div>
<p>Con <code>MOCK_EXTERNAL_APIS=1</code>, <code>instrumentation.ts</code> arranca un interceptor de MSW (<code>msw/node</code>) al iniciar <code>next dev</code>. Ese interceptor responde las llamadas server-side a proveedores externos con una API en memoria. Los adapters de <code>infrastructure</code> no cambian: siguen haciendo <code>fetch</code> a las URLs reales, y MSW responde antes de que la request salga a la red.</p>
<p>Por ahora solo se simula Mercado Pago. Cualquier otra request (Postgres, Better Auth, Google, Cloudflare, GitHub) pasa sin cambios a la red real (<code>onUnhandledFrame: "bypass"</code>).</p>
</div>

<div class="section">
  <div class="section-num">02</div>
  <div class="section-title">Activation</div>
<table>
  <tr><th>Variable</th><th>Valores</th><th>Efecto</th></tr>
  <tr><td><code>MOCK_EXTERNAL_APIS</code></td><td><code>1</code> o <code>true</code></td><td>Activa los mocks. Solo tiene efecto con <code>NODE_ENV=development</code> y runtime <code>nodejs</code>.</td></tr>
  <tr><td><code>MOCK_MERCADO_PAGO_CHECKOUT_STATUS</code></td><td><code>authorized</code> (default) o <code>pending</code></td><td>Resultado simulado del checkout: miembro que paga o que abandona el checkout.</td></tr>
</table>
<ul>
  <li>La regla de activación vive en <code>src/modules/shared/infrastructure/dev-mocks/external-api-mocks-activation.ts</code>.</li>
  <li>Si la flag aparece fuera de <code>next dev</code> (build, producción, tests), se ignora y se registra un warning <code>resolve-external-api-mocks-activation</code>.</li>
  <li>El chequeo literal de <code>process.env.NODE_ENV</code> en <code>instrumentation.ts</code> permite que el build de producción elimine los imports de los mocks.</li>
  <li>Al arrancar, el servidor registra el warning <code>start-external-api-mocks</code> con la lista <code>mockedProviders</code>, para que sea evidente que no se está usando el proveedor real.</li>
</ul>
<div class="code-block"><pre># .env.local
MOCK_EXTERNAL_APIS=1
# MOCK_MERCADO_PAGO_CHECKOUT_STATUS=pending

pnpm run dev</pre></div>
<div class="callout c-warn">El estado simulado vive en memoria del proceso: reiniciar <code>next dev</code> lo borra. Los IDs de Mercado Pago guardados en la base (planes, preapprovals, tokens) dejan de existir en el mock y las lecturas devuelven 404. No uses los mocks contra una base que compartas con el proveedor real.</div>
</div>

<div class="section">
  <div class="section-num">03</div>
  <div class="section-title">Mercado Pago</div>
<p>Handlers en <code>src/modules/subscriptions/infrastructure/mercado-pago/dev-mocks/mercado-pago-mock-handlers.ts</code>. Cubren todos los endpoints que consume <code>mercado-pago-subscription-gateway.ts</code>, con las URLs compartidas de <code>src/modules/subscriptions/constants/mercado-pago.ts</code>.</p>
<table>
  <tr><th>Endpoint</th><th>Comportamiento simulado</th></tr>
  <tr><td><code>POST /oauth/token</code></td><td>Con <code>authorization_code</code> crea una cuenta de vendedor nueva con cualquier código. Con <code>refresh_token</code> rota los tokens de esa cuenta, y un refresh token desconocido devuelve 400 <code>invalid_grant</code>.</td></tr>
  <tr><td><code>/preapproval_plan</code></td><td>Alta (estado <code>active</code>), lectura, actualización y búsqueda por <code>external_reference</code>.</td></tr>
  <tr><td><code>/preapproval</code></td><td>Alta idempotente por <code>X-Idempotency-Key</code>. Su <code>init_point</code> es el <code>back_url</code> con <code>?preapproval_id=</code>: el miembro vuelve directo a la tribu como si hubiera pasado por el checkout. Incluye lectura, actualización de <code>back_url</code> y <code>status</code>, y búsqueda por <code>q</code>.</td></tr>
  <tr><td><code>/authorized_payments</code>, <code>/v1/payments</code></td><td>Sin facturas ni pagos: la búsqueda devuelve una lista vacía y la lectura por ID devuelve 404.</td></tr>
</table>
<p><strong>Conectar una cuenta de vendedor.</strong> La autorización OAuth es una redirección del navegador a <code>auth.mercadopago.com.ar</code>, y MSW no la intercepta. En esa pantalla, copiá el parámetro <code>state</code> de la URL y abrí <code>https://dev.tutribu.app/api/mercado-pago/oauth/callback?code=mock&amp;state=&lt;state&gt;</code>. El intercambio del código lo responde el mock. <code>MERCADO_PAGO_CLIENT_ID</code> y <code>MERCADO_PAGO_CLIENT_SECRET</code> pueden ser cualquier valor no vacío.</p>
<p><strong>Webhooks.</strong> El mock no envía notificaciones. El estado de la suscripción se reconcilia cuando el miembro vuelve con <code>preapproval_id</code>, igual que en el flujo de retorno real.</p>
</div>

<div class="section">
  <div class="section-num">04</div>
  <div class="section-title">Adding a provider</div>
<ul>
  <li>Crear los handlers en <code>src/modules/&lt;feature&gt;/infrastructure/&lt;provider&gt;/dev-mocks/</code>, con una factory que devuelva handlers con estado propio (<code>create&lt;Provider&gt;MockHandlers</code>).</li>
  <li>Reusar las URLs del adapter desde <code>src/modules/&lt;feature&gt;/constants/</code>, sin duplicarlas.</li>
  <li>Registrar la fuente en <code>instrumentation.ts</code>, que es el único punto de composición. <code>shared</code> no importa módulos de feature.</li>
  <li>Cubrir los handlers con un test de integración que ejecute el adapter real contra <code>setupServer</code> (ver <code>tests/integration/modules/subscriptions/mercado-pago-mock-handlers.test.ts</code>).</li>
</ul>
<div class="callout c-info">Estos mocks son tooling de desarrollo local. No reemplazan los tests unitarios e integrales de los adapters, ni la validación de base de datos en branches efímeras de Neon.</div>
</div>
