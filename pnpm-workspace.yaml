overrides:
  # SitePing imports html2canvas@1.4.1, which cannot parse modern CSS color
  # functions (lab/oklch/color()) emitted by Tailwind v4, so screenshot capture
  # throws. html2canvas-pro is a drop-in v1-API fork that supports them.
  html2canvas: 'npm:html2canvas-pro@^1.5.13'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: true
  workerd: true
minimumReleaseAgeExclude:
  - beez-ui
  - beez-rp
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - '@types/node@24.13.4 || 26.5.1'
